spring:
  datasource:
    url: jdbc:mysql://mysql:3306/bookstore_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:bookstore}
    password: ${SPRING_DATASOURCE_PASSWORD:bookstore}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# RS256 JWT — key PEM trong thư mục key/ (local: ./key, Docker/K8s: /key)
app:
  jwt:
    keys-dir: ${APP_JWT_KEYS_DIR:./key}
    private-key-file: private.pem
    public-key-file: public.pem
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# Cloudinary — upload avatar PUT /api/v1/users/profile (giống monolith bookstore/avatars).
# Ví dụ .env: CLOUDINARY_ENABLED=true, CLOUDINARY_CLOUD_NAME=..., CLOUDINARY_API_KEY=..., CLOUDINARY_API_SECRET=...
cloudinary:
  enabled: ${CLOUDINARY_ENABLED:true}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY:CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET:CLOUDINARY_API_SECRET}
